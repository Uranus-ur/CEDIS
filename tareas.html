<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas Pendientes (Tracker) · CEDIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #12161D;
    --panel: #1B2129;
    --panel-alt: #20272F;
    --border: #2B3440;
    --text: #E7EAEE;
    --muted: #8B94A3;
    --faint: #6B7280;
    --accent: #FF7A3D;
    --good: #2FD9A8;
    --bad: #F0555A;
    --devolucion: #B98CFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 56px 20px 60px; }
  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px;
  }
  h1 {
    font-family: "Oswald", "Segoe UI", sans-serif;
    font-size: 32px; font-weight: 700; letter-spacing: 0.01em; margin: 0 0 8px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 24px; max-width: 520px; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; white-space: nowrap;
    transition: border-color .15s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  .tareas-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin-bottom: 28px;
  }

  /* ---- Barra de resumen: una sola fila compacta ---- */
  .tareas-stats {
    display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 18px;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .stat-box {
    flex: 1 1 0; min-width: 90px; text-align: center; padding: 10px 6px;
    border-right: 1px solid var(--border);
  }
  .stat-box:last-child { border-right: none; }
  .stat-box .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 18px; font-weight: 700; line-height: 1.1; }
  .stat-box .lbl { font-size: 9.5px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-box.total .num { color: var(--text); }
  .stat-box.pendiente .num { color: var(--muted); }
  .stat-box.progreso .num { color: #3DB8FF; }
  .stat-box.finalizado .num { color: var(--good); }
  .stat-box.novedad .num { color: var(--bad); }
  .stat-box.vencidas .num { color: var(--bad); }
  .stat-box.vencidas { background: rgba(240,85,90,0.06); }

  /* ---- Formulario colapsable ---- */
  .tarea-form-toggle {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 16px;
    background: transparent; color: var(--accent); font-weight: 600; font-size: 13px;
    border-radius: 8px; padding: 6px 0; border: none; user-select: none;
  }
  .tarea-form-toggle:hover { opacity: 0.8; }
  .tarea-form-toggle .caret { transition: transform .15s; font-size: 11px; }
  .tarea-form-toggle.open .caret { transform: rotate(180deg); }
  .tarea-form-wrap { display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .tarea-form-wrap.open { display: block; }

  .tarea-form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
  @media (min-width: 700px) { .tarea-form-grid { grid-template-columns: repeat(4, 1fr); align-items: end; } }
  .tarea-field { display: flex; flex-direction: column; gap: 4px; }
  .tarea-field label { font-size: 11px; color: var(--muted); }
  .tarea-field input, .tarea-field select, .tarea-field textarea {
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit; outline: none; width: 100%;
    resize: vertical;
  }
  .tarea-field input:focus, .tarea-field select:focus, .tarea-field textarea:focus { border-color: var(--accent); }
  .tarea-add-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tarea-add-row button, .btn-importar {
    background: var(--accent); border: none; color: #1A0F08; font-weight: 700; font-size: 13px;
    border-radius: 8px; padding: 9px 18px; cursor: pointer; white-space: nowrap; display: inline-block;
  }
  .tarea-add-row button:hover, .btn-importar:hover { opacity: 0.9; }
  .btn-importar {
    background: var(--panel-alt); color: var(--text); border: 1px solid var(--border);
  }
  .btn-importar:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

  /* ---- Tabla compacta de tareas activas (tipo Excel) ---- */
  .tabla-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  .tareas-tabla { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
  .tareas-tabla col.col-estado { width: 130px; }
  .tareas-tabla col.col-titulo { width: 26%; }
  .tareas-tabla col.col-responsable { width: 13%; }
  .tareas-tabla col.col-sede { width: 10%; }
  .tareas-tabla col.col-area { width: 10%; }
  .tareas-tabla col.col-prioridad { width: 90px; }
  .tareas-tabla col.col-fecha { width: 90px; }
  .tareas-tabla col.col-acciones { width: 70px; }
  .tareas-tabla th {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--panel-alt);
    position: sticky; top: 0;
  }
  .tareas-tabla td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; word-break: break-word; }
  .tareas-tabla tbody tr:last-child td { border-bottom: none; }
  .tareas-tabla tbody tr:hover { background: var(--panel-alt); }
  .tareas-tabla td.col-titulo { white-space: normal; font-weight: 600; }
  .col-estado-cell { display: flex; align-items: center; gap: 6px; }
  .fila-tarea.progreso td { background: rgba(61,184,255,0.03); }
  .fila-tarea.finalizado td { background: rgba(47,217,168,0.02); opacity: 0.65; }
  .fila-tarea.novedad td { background: rgba(240,85,90,0.05); }
  .tabla-select {
    font-size: 11px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 4px 6px; font-family: inherit;
  }
  .tarea-item-obs { font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; font-style: italic; white-space: normal; word-break: break-word; }

  /* ---- Tarjetas: se siguen usando en la sección de Archivadas ---- */
  .tarea-item {
    background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; margin-bottom: 7px; font-size: 12.5px;
  }
  .tarea-item:hover { border-color: var(--accent); }
  .tarea-item-titulo { margin-bottom: 4px; line-height: 1.35; word-break: break-word; font-weight: 600; }
  .tarea-item-meta { font-size: 10.5px; color: var(--muted); margin-bottom: 5px; line-height: 1.5; }
  .tarea-item-meta .asignado { color: var(--accent); font-weight: 600; }
  .prioridad-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em; }
  .prioridad-badge .pdot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
  .prioridad-badge.alta { background: rgba(240,85,90,0.15); color: var(--bad); }
  .prioridad-badge.alta .pdot { background: var(--bad); }
  .prioridad-badge.media { background: rgba(240,201,61,0.15); color: #F0C93D; }
  .prioridad-badge.media .pdot { background: #F0C93D; }
  .prioridad-badge.baja { background: rgba(61,184,255,0.15); color: #3DB8FF; }
  .prioridad-badge.baja .pdot { background: #3DB8FF; }
  .vencida-badge {
    display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.02em; background: rgba(240,85,90,0.18); color: var(--bad); margin-left: 4px;
  }
  .tarea-item-controls { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
  .tarea-item-controls select {
    flex: 1; font-size: 10.5px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 4px 5px; font-family: inherit;
  }
  .tarea-item-controls button {
    background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 3px 5px;
  }
  .tarea-item-controls button:hover { color: var(--bad); }
  .tarea-item-controls button.btn-archivar:hover { color: var(--accent); }
  .tarea-item-controls button.btn-restaurar:hover { color: var(--good); }

  .tareas-archivo-toggle {
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    padding: 12px 0 0; margin-top: 16px; border-top: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .tareas-archivo-toggle:hover { color: var(--text); }
  .tareas-archivo-toggle .caret { transition: transform .15s; font-size: 11px; }
  .tareas-archivo-toggle.open .caret { transform: rotate(180deg); }
  .tareas-archivo-lista { display: none; margin-top: 12px; grid-template-columns: 1fr; gap: 8px; max-height: 420px; overflow-y: auto; }
  .tareas-archivo-lista.open { display: grid; }
  @media (min-width: 700px) { .tareas-archivo-lista.open { grid-template-columns: 1fr 1fr; } }
  .tarea-item.archivada { opacity: 0.65; }
  .tarea-item.archivada:hover { opacity: 0.9; }
  .tarea-item-fecha-archivo { font-size: 10px; color: var(--faint); margin-top: 4px; }

  .tarea-item.pendiente { border-left: 2px solid var(--muted); }
  .tarea-item.progreso { border-left: 2px solid #3DB8FF; }
  .tarea-item.finalizado { border-left: 2px solid var(--good); opacity: 0.7; }
  .tarea-item.finalizado:hover { opacity: 0.9; }
  .tarea-item.novedad { border-left: 2px solid var(--bad); }

  .tareas-empty-col {
    font-size: 11px; color: var(--muted); font-style: italic; padding: 14px 8px; text-align: center;
    border: 1px dashed var(--border); border-radius: 8px;
  }
  .tareas-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header-top">
    <div>
      <div class="eyebrow">⛭ Seguimiento operativo · CEDIS</div>
      <h1>Tareas Pendientes (Tracker)</h1>
      <p class="subtitle">Tareas generales del equipo/operación de CEDIS. Se guardan en Supabase y se ven desde cualquier computador.</p>
    </div>
    <a class="nav-btn" href="index.html">← Volver al inicio</a>
  </div>

  <div class="tareas-card">

    <div class="tareas-stats" id="tareasStats"></div>

    <button type="button" class="tarea-form-toggle" id="tareaFormToggle">
      <span>+ Nueva tarea</span>
      <span class="caret">▾</span>
    </button>

    <div class="tarea-form-wrap" id="tareaFormWrap">
    <div class="tarea-form-grid">
      <div class="tarea-field" style="grid-column: 1 / -1;">
        <label for="nuevaTareaTitulo">Tarea / Actividad</label>
        <input type="text" id="nuevaTareaTitulo" placeholder="Describe la tarea…">
      </div>
      <div class="tarea-field">
        <label for="nuevaTareaAsignado">Responsable</label>
        <input type="text" id="nuevaTareaAsignado" placeholder="Nombre (opcional)">
      </div>
      <div class="tarea-field">
        <label for="nuevaTareaSede">Sede / CEDIS</label>
        <input type="text" id="nuevaTareaSede" placeholder="Ej: Bogotá (opcional)">
      </div>
      <div class="tarea-field">
        <label for="nuevaTareaArea">Área</label>
        <input type="text" id="nuevaTareaArea" placeholder="Ej: Inventario (opcional)">
      </div>
      <div class="tarea-field">
        <label for="nuevaTareaPrioridad">Prioridad</label>
        <select id="nuevaTareaPrioridad">
          <option value="">Sin prioridad</option>
          <option value="Alta">Alta</option>
          <option value="Media">Media</option>
          <option value="Baja">Baja</option>
        </select>
      </div>
      <div class="tarea-field">
        <label for="nuevaTareaInicio">Fecha compromiso</label>
        <input type="date" id="nuevaTareaInicio">
      </div>
      <div class="tarea-field">
        <label for="nuevaTareaFin">Fecha cierre</label>
        <input type="date" id="nuevaTareaFin">
      </div>
      <div class="tarea-field">
        <label for="nuevaTareaEstado">Estado</label>
        <select id="nuevaTareaEstado">
          <option value="Pendiente">Pendiente</option>
          <option value="En progreso">En progreso</option>
          <option value="Finalizado">Finalizado</option>
          <option value="Novedad">Novedad</option>
        </select>
      </div>
      <div class="tarea-field" style="grid-column: 1 / -1;">
        <label for="nuevaTareaObservaciones">Observaciones</label>
        <textarea id="nuevaTareaObservaciones" placeholder="Notas adicionales (opcional)" rows="2"></textarea>
      </div>
    </div>
    <div class="tarea-add-row">
      <label class="btn-importar" for="inputImportarExcel">📥 Importar desde Excel</label>
      <input type="file" id="inputImportarExcel" accept=".xlsx,.xls" style="display:none;">
      <button id="btnAgregarTarea" type="button">+ Agregar tarea</button>
    </div>
    <div class="tareas-msg" id="tareasMsg"></div>
    </div>

    <div id="tareasTabla"></div>

    <div class="tareas-archivo-toggle" id="tareasArchivoToggle">
      <span>🗄 Tareas Archivadas (<span id="tareasArchivoCount">0</span>)</span>
      <span class="caret">▾</span>
    </div>
    <div class="tareas-archivo-lista" id="tareasArchivoLista"></div>
  </div>

</div>

<script>

  // ---------- Tablero de tareas pendientes (Supabase) ----------
  // Reemplaza estos dos valores con los de tu proyecto (Settings → API).
  // Es el MISMO proyecto que usan indicador-atencion-ventana.html y reportes.html.
  const SUPABASE_URL = "https://ifwtjxashfkdytuuqrlu.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_AjKlPDSBmwJ_zxVxL6RxEw_xJcyGQ-p";
  const TABLA_TAREAS = "tareas";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const ESTADOS_TAREA = [
    { valor: "Pendiente", clase: "pendiente", icono: "⏳" },
    { valor: "En progreso", clase: "progreso", icono: "🔧" },
    { valor: "Finalizado", clase: "finalizado", icono: "✅" },
    { valor: "Novedad", clase: "novedad", icono: "⚠️" },
  ];

  let tareas = [];
  let tareasCargando = true;
  let tareasError = null;

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function fmtFecha(iso) {
    if (!iso) return "";
    const [y, m, d] = iso.split("-");
    const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${Number(d)} ${meses[Number(m) - 1]}`;
  }

  function estadoInfo(valor) {
    return ESTADOS_TAREA.find(e => e.valor === valor) || ESTADOS_TAREA[0];
  }

  function opcionesEstado(seleccionado) {
    return ESTADOS_TAREA.map(e => `<option value="${e.valor}" ${e.valor === seleccionado ? "selected" : ""}>${e.icono} ${e.valor}</option>`).join("");
  }

  async function cargarTareas() {
    tareasCargando = true;
    tareasError = null;
    renderTareas();
    const { data, error } = await sb
      .from(TABLA_TAREAS)
      .select("*")
      .order("created_at", { ascending: true });

    tareasCargando = false;
    if (error) {
      tareasError = error.message;
      tareas = [];
    } else {
      tareas = data || [];
    }
    renderTareas();
  }

  async function agregarTarea() {
    const input = document.getElementById("nuevaTareaTitulo");
    const inputAsignado = document.getElementById("nuevaTareaAsignado");
    const inputSede = document.getElementById("nuevaTareaSede");
    const inputArea = document.getElementById("nuevaTareaArea");
    const selectPrioridad = document.getElementById("nuevaTareaPrioridad");
    const inputObservaciones = document.getElementById("nuevaTareaObservaciones");
    const inputInicio = document.getElementById("nuevaTareaInicio");
    const inputFin = document.getElementById("nuevaTareaFin");
    const selectEstado = document.getElementById("nuevaTareaEstado");
    const msgEl = document.getElementById("tareasMsg");
    const titulo = input.value.trim();
    if (!titulo) {
      msgEl.innerHTML = `<span style="color:var(--bad)">Escribe una tarea antes de agregar.</span>`;
      return;
    }
    msgEl.textContent = "Guardando en Supabase…";
    const { data, error } = await sb
      .from(TABLA_TAREAS)
      .insert({
        titulo,
        estado: selectEstado.value,
        asignado_a: inputAsignado.value.trim() || null,
        sede: inputSede.value.trim() || null,
        area: inputArea.value.trim() || null,
        prioridad: selectPrioridad.value || null,
        observaciones: inputObservaciones.value.trim() || null,
        fecha_inicio: inputInicio.value || null,
        fecha_fin: inputFin.value || null,
      })
      .select();

    if (error) {
      msgEl.innerHTML = `<span style="color:var(--bad)">No se pudo guardar: ${escapeHtml(error.message)}</span>`;
      return;
    }
    if (data && data[0]) tareas = [...tareas, data[0]];
    input.value = "";
    inputAsignado.value = "";
    inputSede.value = "";
    inputArea.value = "";
    selectPrioridad.value = "";
    inputObservaciones.value = "";
    inputInicio.value = "";
    inputFin.value = "";
    selectEstado.value = "Pendiente";
    msgEl.innerHTML = `<span style="color:var(--good)">Tarea agregada.</span>`;
    setTimeout(() => { msgEl.innerHTML = ""; }, 2500);
    renderTareas();
  }

  // ---------- Importar tareas desde Excel ----------
  function parseFechaTexto(v) {
    if (v === null || v === undefined || v === "") return null;
    if (v instanceof Date) {
      const y = v.getFullYear(), m = String(v.getMonth() + 1).padStart(2, "0"), d = String(v.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    const s = String(v).trim();
    const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); // dd/mm/yyyy
    if (m1) return `${m1[3]}-${m1[2].padStart(2, "0")}-${m1[1].padStart(2, "0")}`;
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    return null;
  }

  function mapEstadoExcel(v) {
    if (!v) return "Pendiente";
    const s = String(v).trim().toLowerCase();
    if (s === "pendiente") return "Pendiente";
    if (s === "en progreso") return "En progreso";
    if (s === "completado" || s === "completada" || s === "finalizado") return "Finalizado";
    if (s === "novedad") return "Novedad";
    return "Pendiente";
  }

  function mapPrioridadExcel(v) {
    if (!v) return null;
    const s = String(v).trim().toLowerCase();
    if (s === "alta") return "Alta";
    if (s === "media") return "Media";
    if (s === "baja") return "Baja";
    return null;
  }

  async function importarDesdeExcel(file) {
    const msgEl = document.getElementById("tareasMsg");
    msgEl.textContent = "Leyendo archivo…";
    try {
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: "array" });
      const nombreHoja = wb.SheetNames.find(n => n.toLowerCase().includes("tracker")) || wb.SheetNames[0];
      const hoja = wb.Sheets[nombreHoja];
      const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: null, raw: true });

      // Busca la fila de encabezados: la primera que tenga "actividad" y "estado"
      let headerIdx = -1;
      let headerMap = {};
      for (let i = 0; i < filas.length; i++) {
        const fila = (filas[i] || []).map(c => (c === null ? "" : String(c).trim().toLowerCase()));
        if (fila.includes("actividad") && fila.includes("estado")) {
          headerIdx = i;
          fila.forEach((nombre, idx) => { if (nombre) headerMap[nombre] = idx; });
          break;
        }
      }
      if (headerIdx === -1) {
        msgEl.innerHTML = `<span style="color:var(--bad)">No encontré una hoja con columnas "Actividad" y "Estado". Revisa el archivo.</span>`;
        return;
      }

      const col = (fila, nombre) => (headerMap[nombre] !== undefined ? fila[headerMap[nombre]] : null);
      const nuevas = [];

      for (let i = headerIdx + 1; i < filas.length; i++) {
        const fila = filas[i];
        if (!fila || fila.every(c => c === null || c === "")) continue;
        const actividad = col(fila, "actividad");
        if (!actividad || !String(actividad).trim()) continue;

        const obsPartes = [col(fila, "descripcion"), col(fila, "observaciones")]
          .filter(v => v && String(v).trim())
          .map(v => String(v).trim());

        nuevas.push({
          titulo: String(actividad).trim(),
          estado: mapEstadoExcel(col(fila, "estado")),
          asignado_a: col(fila, "responsable") ? String(col(fila, "responsable")).trim() : null,
          sede: col(fila, "sede") ? String(col(fila, "sede")).trim() : null,
          area: col(fila, "area") ? String(col(fila, "area")).trim() : null,
          prioridad: mapPrioridadExcel(col(fila, "prioridad")),
          observaciones: obsPartes.length > 0 ? obsPartes.join(" — ") : null,
          fecha_inicio: parseFechaTexto(col(fila, "f.compromiso")),
          fecha_fin: parseFechaTexto(col(fila, "f.cierre")),
        });
      }

      if (nuevas.length === 0) {
        msgEl.innerHTML = `<span style="color:var(--bad)">No encontré filas con actividad para importar en la hoja "${escapeHtml(nombreHoja)}".</span>`;
        return;
      }

      msgEl.textContent = `Importando ${nuevas.length} tareas a Supabase…`;
      const { data, error } = await sb.from(TABLA_TAREAS).insert(nuevas).select();
      if (error) {
        msgEl.innerHTML = `<span style="color:var(--bad)">No se pudo importar: ${escapeHtml(error.message)}</span>`;
        return;
      }
      tareas = [...tareas, ...(data || [])];
      msgEl.innerHTML = `<span style="color:var(--good)">Se importaron ${data.length} tareas desde "${escapeHtml(nombreHoja)}".</span>`;
      setTimeout(() => { msgEl.innerHTML = ""; }, 4500);
      renderTareas();
    } catch (err) {
      msgEl.innerHTML = `<span style="color:var(--bad)">Error leyendo el archivo: ${escapeHtml(err.message)}</span>`;
    }
  }

  async function cambiarEstadoTarea(id, nuevoEstado) {
    const anterior = tareas;
    tareas = tareas.map(t => (t.id === id ? { ...t, estado: nuevoEstado } : t));
    renderTareas();
    const { error } = await sb.from(TABLA_TAREAS).update({ estado: nuevoEstado }).eq("id", id);
    if (error) {
      tareas = anterior;
      alert("No se pudo actualizar la tarea: " + error.message);
      renderTareas();
    }
  }

  async function archivarTarea(id) {
    const anterior = tareas;
    tareas = tareas.map(t => (t.id === id ? { ...t, archivada: true } : t));
    renderTareas();
    const { error } = await sb.from(TABLA_TAREAS).update({ archivada: true }).eq("id", id);
    if (error) {
      tareas = anterior;
      alert("No se pudo archivar la tarea: " + error.message);
      renderTareas();
    }
  }

  async function restaurarTarea(id) {
    const anterior = tareas;
    tareas = tareas.map(t => (t.id === id ? { ...t, archivada: false } : t));
    renderTareas();
    const { error } = await sb.from(TABLA_TAREAS).update({ archivada: false }).eq("id", id);
    if (error) {
      tareas = anterior;
      alert("No se pudo restaurar la tarea: " + error.message);
      renderTareas();
    }
  }

  async function eliminarTarea(id) {
    const anterior = tareas;
    tareas = tareas.filter(t => t.id !== id);
    renderTareas();
    const { error } = await sb.from(TABLA_TAREAS).delete().eq("id", id);
    if (error) {
      tareas = anterior;
      alert("No se pudo eliminar la tarea: " + error.message);
      renderTareas();
    }
  }

  function prioridadBadge(prioridad) {
    if (!prioridad) return "";
    const clase = prioridad.toLowerCase();
    return `<span class="prioridad-badge ${clase}"><span class="pdot"></span>${escapeHtml(prioridad)}</span>`;
  }

  function metaHtmlDe(t) {
    const partes = [];
    if (t.asignado_a) partes.push(`👤 <span class="asignado">${escapeHtml(t.asignado_a)}</span>`);
    if (t.sede) partes.push(`📍 ${escapeHtml(t.sede)}`);
    if (t.area) partes.push(`🗂 ${escapeHtml(t.area)}`);
    if (t.fecha_inicio) partes.push(`Compromiso: ${fmtFecha(t.fecha_inicio)}`);
    if (t.fecha_fin) partes.push(`Cierre: ${fmtFecha(t.fecha_fin)}`);

    let out = "";
    if (t.prioridad || partes.length > 0) {
      out += `<div class="tarea-item-meta">`;
      if (t.prioridad) out += prioridadBadge(t.prioridad) + " ";
      out += partes.join(" · ");
      out += `</div>`;
    }
    if (t.observaciones) out += `<div class="tarea-item-obs">📝 ${escapeHtml(t.observaciones)}</div>`;
    return out;
  }

  function hoyISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function esVencida(t) {
    if (!t.fecha_fin || t.estado === "Finalizado") return false;
    return t.fecha_fin < hoyISO();
  }

  function renderStats() {
    const el = document.getElementById("tareasStats");
    const activas = tareas.filter(t => !t.archivada);
    const conteo = { Pendiente: 0, "En progreso": 0, Finalizado: 0, Novedad: 0 };
    let vencidas = 0;
    activas.forEach(t => {
      if (conteo[t.estado] !== undefined) conteo[t.estado]++;
      if (esVencida(t)) vencidas++;
    });
    el.innerHTML = `
      <div class="stat-box total"><div class="num">${activas.length}</div><div class="lbl">◧ Total</div></div>
      <div class="stat-box pendiente"><div class="num">${conteo["Pendiente"]}</div><div class="lbl">⏳ Pendiente</div></div>
      <div class="stat-box progreso"><div class="num">${conteo["En progreso"]}</div><div class="lbl">🔧 En progreso</div></div>
      <div class="stat-box finalizado"><div class="num">${conteo["Finalizado"]}</div><div class="lbl">✅ Finalizado</div></div>
      <div class="stat-box novedad"><div class="num">${conteo["Novedad"]}</div><div class="lbl">⚠️ Novedad</div></div>
      <div class="stat-box vencidas"><div class="num">${vencidas}</div><div class="lbl">🔴 Vencidas</div></div>
    `;
  }

  function renderTareas() {
    const cont = document.getElementById("tareasTabla");
    if (tareasCargando) {
      cont.innerHTML = `<div class="tareas-empty-col">Cargando tareas desde Supabase…</div>`;
      return;
    }
    if (tareasError) {
      cont.innerHTML = `<div class="tareas-empty-col" style="color:var(--bad)">No se pudo conectar con Supabase: ${escapeHtml(tareasError)}<br>Revisa la URL, la anon key y que la tabla "${TABLA_TAREAS}" exista.</div>`;
      return;
    }
    const activas = tareas.filter(t => !t.archivada);
    if (activas.length === 0) {
      cont.innerHTML = `<div class="tareas-empty-col">No hay tareas activas. Agrega una con "+ Nueva tarea" o importa tu Excel.</div>`;
      renderStats();
      renderArchivadas();
      return;
    }

    // Orden: primero Novedad, luego En progreso, luego Pendiente, luego Finalizado.
    // Dentro de cada grupo, las vencidas van primero.
    const ordenEstado = { Novedad: 0, "En progreso": 1, Pendiente: 2, Finalizado: 3 };
    const ordenadas = activas.slice().sort((a, b) => {
      const oa = ordenEstado[a.estado] ?? 9, ob = ordenEstado[b.estado] ?? 9;
      if (oa !== ob) return oa - ob;
      const va = esVencida(a) ? 0 : 1, vb = esVencida(b) ? 0 : 1;
      return va - vb;
    });

    const filas = ordenadas.map(t => {
      const info = ESTADOS_TAREA.find(e => e.valor === t.estado) || ESTADOS_TAREA[0];
      return `
        <tr class="fila-tarea ${info.clase}">
          <td>
            <div class="col-estado-cell">
              <select data-id="${t.id}" class="tarea-select-estado tabla-select">${opcionesEstado(t.estado)}</select>
              ${esVencida(t) ? '<span class="vencida-badge">Vencida</span>' : ""}
            </div>
          </td>
          <td class="col-titulo">
            ${escapeHtml(t.titulo)}
            ${t.observaciones ? `<div class="tarea-item-obs">📝 ${escapeHtml(t.observaciones)}</div>` : ""}
          </td>
          <td>${t.asignado_a ? escapeHtml(t.asignado_a) : "—"}</td>
          <td>${t.sede ? escapeHtml(t.sede) : "—"}</td>
          <td>${t.area ? escapeHtml(t.area) : "—"}</td>
          <td>${t.prioridad ? prioridadBadge(t.prioridad) : "—"}</td>
          <td>${t.fecha_inicio ? fmtFecha(t.fecha_inicio) : "—"}</td>
          <td>${t.fecha_fin ? fmtFecha(t.fecha_fin) : "—"}</td>
          <td>
            <div class="tarea-item-controls">
              <button type="button" data-id="${t.id}" class="btn-archivar tarea-btn-archivar" title="Archivar (guardar como registro histórico)">📦</button>
              <button type="button" data-id="${t.id}" class="tarea-btn-eliminar" title="Eliminar definitivamente">🗑</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");

    cont.innerHTML = `
      <div class="tabla-wrap">
        <table class="tareas-tabla">
          <colgroup>
            <col class="col-estado"><col class="col-titulo"><col class="col-responsable">
            <col class="col-sede"><col class="col-area"><col class="col-prioridad">
            <col class="col-fecha"><col class="col-fecha"><col class="col-acciones">
          </colgroup>
          <thead>
            <tr>
              <th>Estado</th><th>Tarea</th><th>Responsable</th><th>Sede</th><th>Área</th><th>Prioridad</th><th>Compromiso</th><th>Cierre</th><th></th>
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    `;

    renderStats();
    renderArchivadas();
  }

  function renderArchivadas() {
    const lista = document.getElementById("tareasArchivoLista");
    const countEl = document.getElementById("tareasArchivoCount");
    const archivadas = tareas.filter(t => t.archivada);
    countEl.textContent = archivadas.length;

    if (archivadas.length === 0) {
      lista.innerHTML = `<div class="tareas-empty-col">Aún no has archivado ninguna tarea.</div>`;
      return;
    }
    lista.innerHTML = archivadas.map(t => {
      const e = estadoInfo(t.estado);
      return `
        <div class="tarea-item ${e.clase} archivada">
          <div class="tarea-item-titulo">${escapeHtml(t.titulo)}</div>
          ${metaHtmlDe(t)}
          <div class="tarea-item-fecha-archivo">${e.icono} ${e.valor}</div>
          <div class="tarea-item-controls" style="margin-top:8px;">
            <button type="button" data-id="${t.id}" class="btn-restaurar tarea-btn-restaurar" title="Restaurar al tablero activo">↩️ Restaurar</button>
            <button type="button" data-id="${t.id}" class="tarea-btn-eliminar" title="Eliminar definitivamente" style="margin-left:auto;">🗑</button>
          </div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("tareaFormToggle").addEventListener("click", () => {
    document.getElementById("tareaFormToggle").classList.toggle("open");
    document.getElementById("tareaFormWrap").classList.toggle("open");
  });
  document.getElementById("btnAgregarTarea").addEventListener("click", agregarTarea);
  document.getElementById("inputImportarExcel").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) importarDesdeExcel(file);
    e.target.value = "";
  });
  document.getElementById("nuevaTareaTitulo").addEventListener("keydown", (e) => {
    if (e.key === "Enter") agregarTarea();
  });
  document.getElementById("tareasTabla").addEventListener("change", (e) => {
    if (!e.target.classList.contains("tarea-select-estado")) return;
    cambiarEstadoTarea(e.target.dataset.id, e.target.value);
  });
  document.getElementById("tareasTabla").addEventListener("click", (e) => {
    const btnEliminar = e.target.closest(".tarea-btn-eliminar");
    if (btnEliminar) { eliminarTarea(btnEliminar.dataset.id); return; }
    const btnArchivar = e.target.closest(".tarea-btn-archivar");
    if (btnArchivar) { archivarTarea(btnArchivar.dataset.id); return; }
  });

  document.getElementById("tareasArchivoToggle").addEventListener("click", () => {
    document.getElementById("tareasArchivoToggle").classList.toggle("open");
    document.getElementById("tareasArchivoLista").classList.toggle("open");
  });
  document.getElementById("tareasArchivoLista").addEventListener("click", (e) => {
    const btnRestaurar = e.target.closest(".tarea-btn-restaurar");
    if (btnRestaurar) { restaurarTarea(btnRestaurar.dataset.id); return; }
    const btnEliminar = e.target.closest(".tarea-btn-eliminar");
    if (btnEliminar) { eliminarTarea(btnEliminar.dataset.id); return; }
  });

  cargarTareas();
</script>
</body>
</html>
